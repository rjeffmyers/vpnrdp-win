name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test VpnRdp.sln -c Release

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0-dev' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish single-file exe
        run: dotnet publish src/VpnRdp/VpnRdp.csproj -p:PublishProfile=win-x64 -p:Version=${{ steps.ver.outputs.version }}

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} installer\VpnRdp.iss

      - uses: actions/upload-artifact@v4
        with:
          name: VpnRdp-${{ steps.ver.outputs.version }}
          path: |
            artifacts/publish/VpnRdp.exe
            artifacts/VpnRdp-Setup-*.exe

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/publish/VpnRdp.exe
            artifacts/VpnRdp-Setup-*.exe
